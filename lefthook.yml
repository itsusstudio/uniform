pre-push:
  follow: true
  commands:
    ci:
      files: echo .lefthook/pre-push/ci.rb
      use_stdin: true
      run: .lefthook/pre-push/ci.rb

pre-commit:
  commands:
    stylelint:
      glob: "*.css"
      run: npx stylelint {staged_files}
    herb:
      glob: "*.erb"
      run: mise exec -- herb-lint --simple {staged_files}
