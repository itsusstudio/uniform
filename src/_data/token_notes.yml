"--u-size-target": "The smallest height for anything you tap that isn't a boxed control: nav links, menu items, checkbox and radio rows, tabs, chips, breadcrumbs and sort headers. 32px for business, 40px for consumer. Both clear the 24px accessibility minimum."
"--u-size-control": "The height of boxed controls: buttons, text fields, selects and toggles. 4px taller than a tap target, so controls sit a little heavier than the rows around them. 36px for business, 44px for consumer."
"--u-color-chart-current": "The series you're looking at now, in ink: this month's revenue line, last week's bar. One per chart."
"--u-color-chart-previous": "The series you compare against, in grey: last month's line, the earlier weeks' bars. Drawn above the fill so it stays visible."
"--u-color-chart-fill": "The colour of the fade under the current line. It follows the current series, so it flips with dark mode."
"--u-chart-fill-opacity": "How strong the fade under a line starts, at the top. It fades to nothing at the baseline. Lighter in dark mode."
"--u-chart-dim-opacity": "How faint the other bars go while you hover one, so the bar you're on stands out."
"--u-chart-lane": "The strip above a chart you can hover, where its tooltip sits so it never covers the bars or the line."
"--u-motion-hover": "How long a hover change takes to fade in, like the other bars dimming on a bar chart. Short enough to feel instant without flashing."
"--u-color-chart-grid": "The faint horizontal gridlines behind a chart."
"--u-color-chart-track": "The empty part of a meter, behind the filled bar."
"--u-font-size-body": "Body text in apps: inputs, notes, card text, short paragraphs. Components use this, never the raw size, so a product can change it in one place."
"--u-font-size-small": "Interface text: labels, buttons, nav, tables, menus. One step below body."
"--u-font-size-caption": "The smallest text: hints, table headers, timestamps, badges."
"--u-line-height-body": "The line height that goes with --u-font-size-body."
"--u-line-height-small": "The line height that goes with --u-font-size-small."
"--u-line-height-caption": "The line height that goes with --u-font-size-caption."
"--u-size-field": "The height of a text field or select with its label. Matches controls for business; 64px for consumer, with the label inside the box. A field with no visible label is the control height."
"--u-icon-stroke": "The line width of every icon, whatever its size. 1.5px for business and 1.75px for consumer, about as thick as the letters beside it."
"--u-size-row": "The smallest height of a table or list row. 44px for business, so one line of 14px text has room to breathe, and 48px for consumer, so rows are easy to tap on a phone."
"--u-font-size-title": "Titles of cards, banners, popovers and empty states. 16px for business, 20px for consumer, so a title stays a step above the 16px text under it."
"--u-line-height-title": "The line height that goes with --u-font-size-title."
"--u-width-scroll-item": "The widest a card gets in a u-scroll-row. On a phone it stops at 80% of the row, so the next card peeks in."
"--u-max-width-form": "The widest a form column gets: a sign-in form, a settings form, one field shown on its own. Also the width of the form half of a split."
"--u-section-space": "The room above and below each section of a site page. 48px, or 24px on phones, so sections sit 96px or 48px apart."
"--u-color-shimmer": "The light band that passes over a chart while it loads. White at 80% on light, 8% in dark mode."
"--u-motion-shimmer": "How long one shimmer pass over a loading chart takes."
"--u-space-1": "4px. Inside one element: an icon to its label, a row of icon buttons, the padding of a chip."
"--u-space-2": "8px. Parts of one item: a label to its input, a heading to its line, buttons side by side."
"--u-space-4": "16px. Items in a group: one field and the next, rows in a list or menu, padding in a popover."
"--u-space-6": "24px. Between blocks: card padding, the heading, fields and buttons of a form, the grid gutter."
"--u-space-12": "48px. Between sections of an app page, and between stats in a row."
"--u-space-24": "96px. Between sections of a marketing site. Never in apps."
"--u-max-width-page": "The widest a page's content gets. Past it, the space at the sides grows."
"--u-max-width-prose": "The widest running text gets, about 65 characters a line, so it stays easy to read."
"--u-width-sidebar": "The width of the sidebar in u-sidebar-layout on wide screens."
"--u-grid-gutter": "The space between grid columns. 24px, and 16px on phones."
"--u-page-margin": "The space between the page content and the edge of the screen. 48px wide, 24px under 1024px, 16px under 640px."
"--u-font-headline": "Apfel Grotezk Mittel. Headlines on marketing sites and blogs, at 32px and larger. Never in an app."
"--u-font-sans": "Inter. All other text, in apps and on sites."
"--u-font-mono": "IBM Plex Mono. Prices, dates, order numbers and codes."
"--u-font-size-prose": "Long reading text inside u-prose: 16 in every audience, a step above business interface text."
"--u-line-height-prose": "Long reading text inside u-prose, so articles and docs breathe more than app screens."
"--u-font-size-56": "Site headlines. Grows with its container, from 36px to 56px."
"--u-font-size-96": "The one hero headline on a site. Grows with its container, from 44px to 96px."
