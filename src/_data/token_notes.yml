"--spacing-target": "The smallest height for anything you tap that isn't a boxed control: nav links, menu items, checkbox and radio rows, tabs, chips, breadcrumbs and sort headers. 32px for business, 40px for consumer. Both clear the 24px accessibility minimum."
"--spacing-control": "The height of boxed controls: buttons, text fields, selects and toggles. 4px taller than a tap target, so controls sit a little heavier than the rows around them. 36px for business, 44px for consumer."
"--u-chart-color-current": "The series you're looking at now, in ink: this month's revenue line, last week's bar. One per chart."
"--u-chart-color-previous": "The series you compare against, in grey: last month's line, the earlier weeks' bars. Drawn above the fill so it stays visible."
"--u-chart-color-fill": "The colour of the fade under the current line. It follows the current series, so it flips with dark mode."
"--u-chart-opacity-fill": "How strong the fade under a line starts, at the top. It fades to nothing at the baseline. Lighter in dark mode."
"--u-chart-opacity-dim": "How faint the other bars go while you hover one, so the bar you're on stands out."
"--u-duration-hover": "How long a hover change takes to fade in, like the other bars dimming on a bar chart. Short enough to feel instant without flashing."
"--u-chart-color-grid": "The faint horizontal gridlines behind a chart."
"--u-chart-color-track": "The empty part of a meter, behind the filled bar."
"--text-body": "Body text in apps: inputs, notes, card text, short paragraphs. Components use this, never the raw size, so a product can change it in one place."
"--text-small": "Interface text: labels, buttons, nav, tables, menus. One step below body."
"--text-caption": "The smallest text: hints, table headers, timestamps, badges."
"--text-body--line-height": "The line height that goes with --text-body."
"--text-small--line-height": "The line height that goes with --text-small."
"--text-caption--line-height": "The line height that goes with --text-caption."
"--spacing-field": "The height of a text field or select with its label. Matches controls for business; 64px for consumer, with the label inside the box. A field with no visible label is the control height."
"--u-icon-stroke-width": "The line width of every icon, whatever its size. 1.5px for business and 1.75px for consumer, about as thick as the letters beside it."
"--spacing-row": "The smallest height of a table or list row. 44px for business, so one line of 14px text has room to breathe, and 48px for consumer, so rows are easy to tap on a phone."
"--text-title": "Titles of cards, banners, popovers and empty states. 16px for business, 20px for consumer, so a title stays a step above the 16px text under it."
"--text-title--line-height": "The line height that goes with --text-title."
"--container-form": "The widest a form column gets: a sign-in form, a settings form, one field shown on its own. Also the width of the form half of a split."
"--spacing-section": "The room above and below each section of a site page. 48px, or 24px on phones, so sections sit 96px or 48px apart."
"--u-shimmer-color": "The light band that passes over a chart while it loads. White at 80% on light, 8% in dark mode."
"--u-shimmer-duration": "How long one shimmer pass over a loading chart takes."
"--container-page": "The widest a page's content gets. Past it, the space at the sides grows."
"--container-page-wide": "max-w-page-wide: data pages in an app, up to 1600px."
"--container-page-narrow": "max-w-page-narrow: settings, forms and reading pages, a 768px column."
"--container-prose": "The widest running text gets, about 65 characters a line, so it stays easy to read."
"--container-sidebar": "The width of the app shell sidebar on wide screens."
"--spacing-gutter": "The space between grid columns. 24px, and 16px on phones."
"--spacing-edge": "The space between the page content and the edge of the screen. 48px wide, 24px under 1024px, 16px under 640px."
"--font-headline": "Apfel Grotezk Mittel. Headlines on marketing sites and blogs, at 32px and larger. Never in an app."
"--font-sans": "Inter. All other text, in apps and on sites."
"--font-mono": "IBM Plex Mono. Prices, dates, order numbers and codes."
"--text-prose": "Long reading text inside u-prose: 16 in every audience, a step above business interface text."
"--leading-prose": "Long reading text inside u-prose, so articles and docs breathe more than app screens."
"--text-700": "Site headlines. Grows with its container, from 36px to 56px."
"--text-800": "The one hero headline on a site. Grows with its container, from 44px to 96px."
"--spacing": "The 4px unit every spacing class counts in, so gap-6 is 24px. In component CSS, write --spacing(6)."
